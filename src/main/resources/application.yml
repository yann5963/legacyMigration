spring:
  application:
    name: migration-tool

  # Config for target PostgreSQL Database
  datasource:
    url: jdbc:postgresql://localhost:5432/migration_db
    username: migration_user
    password: migration_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Spring AI Configuration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          # Spécifiez le modèle Ollama que vous souhaitez utiliser (ex: mistral, llama3)
          model: mistral
          temperature: 0.2

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536 # À ajuster selon le modèle d'embedding utilisé

# Configuration spécifique à l'outil de migration
migration:
  source:
    # URL JDBC pour la base Informix
    informix-url: jdbc:informix-sqli://localhost:9088/legacy_db:INFORMIXSERVER=informix;USER=informix;PASSWORD=informix_password
    # Chemin vers le répertoire contenant le code source legacy J2EE
    legacy-dir: /path/to/legacy/j2ee/project

  target:
    # Chemin où le nouveau code Spring Boot sera généré
    output-dir: /path/to/migrated/springboot/project

  # Si true, l'outil demandera une validation humaine dans la console pour les étapes ambiguës
  require-human-validation: true
