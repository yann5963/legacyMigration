spring:
  config:
    import: optional:classpath:prompts.yml,optional:file:./config/prompts.yml
  application:
    name: migration-tool

  # Config for target PostgreSQL Database
  datasource:
    url: jdbc:postgresql://localhost:5432/migration_db
    username: yann
    password: postgresql
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # Spring AI Configuration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text:v1.5

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768 # Cohérent avec nomic-embed-text (768 dimensions)
        remove-existing-vector-store-table: false

# Configuration spécifique à l'outil de migration
migration:
  ai:
    available-models:
      - llama3.2:3b
      - granite4.1:3b
      - qwen3:4b
      - qwen2.5-coder:3b
      - gemma4-light:latest
      - gemma4:31b-cloud
      - gemma4:e2b
      - lfm3:latest

  source:
    # URL JDBC pour la base Informix
    informix-url: jdbc:informix-sqli://localhost:9088/legacy_db:INFORMIXSERVER=informix;USER=informix;PASSWORD=informix_password
    # Chemin vers le répertoire contenant le code source legacy J2EE
    legacy-dir: /path/to/legacy/j2ee/project

  target:
    # Chemin où le nouveau code Spring Boot sera généré
    output-dir: /path/to/migrated/springboot/project
    base-dir: /path/to/spring-app/src/main/java
    base-package: com.company.myapp

  # Si true, l'outil demandera une validation humaine dans la console pour les étapes ambiguës
  require-human-validation: true

