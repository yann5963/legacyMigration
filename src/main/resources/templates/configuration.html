<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration de Migration</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Migration Tool</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/configuration">Configuration</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Configuration Globale</h1>

    <div class="card mb-4">
        <div class="card-header">Paramètres du Projet Cible</div>
        <div class="card-body">
            <form id="configForm">
                <div class="mb-3">
                    <label for="targetJavaVersion" class="form-label">Version de Java cible</label>
                    <select class="form-select" id="targetJavaVersion" required>
                        <option value="17">17</option>
                        <option value="19" selected>19</option>
                        <option value="21">21</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="targetSpringBootVersion" class="form-label">Version de Spring Boot cible</label>
                    <input type="text" class="form-control" id="targetSpringBootVersion" value="3.x" required>
                </div>
                <div class="mb-3">
                    <label for="targetGroupId" class="form-label">Group ID cible (Optionnel)</label>
                    <input type="text" class="form-control" id="targetGroupId" placeholder="com.migrated">
                </div>
                <div class="mb-3">
                    <label for="targetArtifactId" class="form-label">Artifact ID cible (Optionnel)</label>
                    <input type="text" class="form-control" id="targetArtifactId" placeholder="app-moderne">
                </div>
                <div class="mb-3">
                    <label for="targetProjectPath" class="form-label">Chemin absolu du projet destination</label>
                    <input type="text" class="form-control" id="targetProjectPath" placeholder="/chemin/vers/projet-destination">
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" id="saveConfigBtn" onclick="saveConfig()">Sauvegarder la configuration</button>
                    <button type="button" class="btn btn-secondary" id="springInitializrBtn" onclick="goToSpringInitializr()" disabled>Spring Initialzr</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Initialisation & Scan des sources</div>
        <div class="card-body">
            <form id="scanForm">
                <div class="mb-3">
                    <label for="sourceRootPath" class="form-label">Chemin absolu du projet source (Legacy)</label>
                    <input type="text" class="form-control" id="sourceRootPath" placeholder="/chemin/vers/projet-legacy" required>
                </div>
                <div class="mb-3">
                    <label for="defaultLlmModel" class="form-label">Modèle LLM par défaut</label>
                    <select class="form-select" id="defaultLlmModel">
                        <!-- Populated via JS -->
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-success" onclick="scanProject()" id="scanButton">Scanner le projet</button>
                    <button type="button" class="btn btn-danger" onclick="resetProject()">Réinitialiser le projet</button>
                </div>
            </form>
            <div id="scanResult" class="mt-3" style="display: none;">
                <div class="alert alert-info" id="scanMessage"></div>
                <a href="/dashboard" class="btn btn-outline-primary">Aller au Dashboard de Migration</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Fetch models first to populate the dropdown
        fetch('/api/configuration/models')
            .then(response => response.json())
            .then(models => {
                const modelSelect = document.getElementById('defaultLlmModel');
                if (models && models.length > 0) {
                    models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        modelSelect.appendChild(option);
                    });
                }

                // Then fetch configuration to select the saved model
                return fetch('/api/configuration');
            })
            .then(response => response.json())
            .then(data => {
                if (data) {
                    document.getElementById('targetJavaVersion').value = data.targetJavaVersion || "19";
                    document.getElementById('targetSpringBootVersion').value = data.targetSpringBootVersion || "3.x";
                    document.getElementById('targetGroupId').value = data.targetGroupId || "";
                    document.getElementById('targetArtifactId').value = data.targetArtifactId || "";

                    const projectPathInput = document.getElementById('targetProjectPath');
                    if (projectPathInput) {
                        projectPathInput.value = data.targetProjectPath || "";
                    }

                    if (data.defaultLlmModel) {
                        document.getElementById('defaultLlmModel').value = data.defaultLlmModel;
                    }

                    checkProjectPath();
                }
            })
            .catch(error => console.error('Error fetching config/models:', error));

        const targetProjectPathInput = document.getElementById('targetProjectPath');
        if (targetProjectPathInput) {
            targetProjectPathInput.addEventListener('input', checkProjectPath);
        }
    });

    function checkProjectPath() {
        const path = document.getElementById('targetProjectPath').value;
        const btn = document.getElementById('springInitializrBtn');
        if (btn) {
            btn.disabled = !path || path.trim() === '';
        }
    }

    function goToSpringInitializr() {
        window.location.href = '/spring-initializr';
    }

    function saveConfig() {
        const config = {
            targetJavaVersion: document.getElementById('targetJavaVersion').value,
            targetSpringBootVersion: document.getElementById('targetSpringBootVersion').value,
            targetGroupId: document.getElementById('targetGroupId').value,
            targetArtifactId: document.getElementById('targetArtifactId').value,
            targetProjectPath: document.getElementById('targetProjectPath') ? document.getElementById('targetProjectPath').value : null
        };

        const btn = document.getElementById('saveConfigBtn');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sauvegarde...';

        fetch('/api/configuration', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(config)
        })
        .then(response => {
            if (response.ok) {
                alert("Configuration sauvegardée avec succès !");
            } else {
                alert("Erreur lors de la sauvegarde de la configuration.");
            }
        })
        .catch(error => {
            console.error('Error saving config:', error);
            alert("Erreur réseau.");
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = originalText;
        });
    }

    function scanProject() {
        const path = document.getElementById('sourceRootPath').value;
        if (!path) {
            alert("Veuillez entrer un chemin valide.");
            return;
        }

        const btn = document.getElementById('scanButton');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Scan en cours...';

        const model = document.getElementById('defaultLlmModel').value;

        fetch('/api/project/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sourceRootPath: path, defaultLlmModel: model })
        })
        .then(response => {
            if (!response.ok) throw new Error("Erreur serveur");
            return response.json();
        })
        .then(data => {
            document.getElementById('scanResult').style.display = 'block';
            document.getElementById('scanMessage').textContent = `${data.filesFound} fichiers pertinents trouvés et préparés pour la conversion.`;
        })
        .catch(error => {
            console.error('Error scanning:', error);
            alert("Erreur lors du scan (Vérifiez le chemin).");
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = originalText;
        });
    }

    function resetProject() {
        if (confirm("Êtes-vous sûr de vouloir réinitialiser le projet ? Cela effacera toute la configuration actuelle et l'état des fichiers scannés.")) {
            fetch('/api/project/reset', {
                method: 'POST'
            })
            .then(response => {
                if (response.ok) {
                    alert("Projet réinitialisé avec succès !");
                    window.location.reload();
                } else {
                    alert("Erreur lors de la réinitialisation du projet.");
                }
            })
            .catch(error => {
                console.error('Error resetting project:', error);
                alert("Erreur réseau.");
            });
        }
    }
</script>
</body>
</html>
