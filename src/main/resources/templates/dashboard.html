<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Migration</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-SCANNED { background-color: #6c757d; }
        .badge-CONVERTING { background-color: #0dcaf0; color: #000; }
        .badge-NEEDS_REVIEW { background-color: #ffc107; color: #000; }
        .badge-VALIDATED { background-color: #198754; }
        .badge-ERROR { background-color: #dc3545; }
        pre { background-color: #f8f9fa; padding: 15px; border: 1px solid #dee2e6; border-radius: 5px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Migration Tool</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/configuration">Configuration</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Dashboard de Migration (Manuel)</h1>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>Type</th>
                <th>Couche</th>
                <th>Fichier (Chemin absolu)</th>
                <th>Fichier(s) Sortant(s)</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="migrationTableBody">
            <!-- Rows will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal for Retrying -->
<div class="modal fade" id="retryModal" tabindex="-1" aria-labelledby="retryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="retryModalLabel">Ajuster avec l'IA: <span id="modalFileName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="retryForm">
                    <input type="hidden" id="modalFileId">
                    <div class="mb-3">
                        <label for="customPrompt" class="form-label">Instructions complémentaires pour l'IA</label>
                        <textarea class="form-control" id="customPrompt" rows="4"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" onclick="submitRetry()">Relancer la conversion</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Viewing Code -->
<div class="modal fade modal-xl" id="codeModal" tabindex="-1" aria-labelledby="codeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="codeModalLabel">Aperçu du Code Généré</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" id="codeTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="source-tab" data-bs-toggle="tab" data-bs-target="#source-pane" type="button" role="tab">Code Source Métier</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="test-tab" data-bs-toggle="tab" data-bs-target="#test-pane" type="button" role="tab">Test Unitaire (JUnit 5)</button>
                    </li>
                </ul>
                <div class="tab-content mt-3" id="codeTabsContent">
                    <div class="tab-pane fade show active" id="source-pane" role="tabpanel"><pre><code id="sourceCodeBlock"></code></pre></div>
                    <div class="tab-pane fade" id="test-pane" role="tabpanel"><pre><code id="testCodeBlock"></code></pre></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let retryModal;
    let codeModal;
    let fileDataMap = new Map();

    document.addEventListener("DOMContentLoaded", function() {
        retryModal = new bootstrap.Modal(document.getElementById('retryModal'));
        codeModal = new bootstrap.Modal(document.getElementById('codeModal'));
        fetchData();
        setInterval(fetchData, 3000); // Polling every 3 seconds
    });

    function fetchData() {
        fetch('/api/migration/files')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('migrationTableBody');
                tbody.innerHTML = ''; // Clear current content

                // Sort by layer
                data.sort((a, b) => (a.layer || 1) - (b.layer || 1));

                // Calculate unvalidated dependencies warning
                const isLayerValidated = (layer) => data.filter(f => f.layer === layer).every(f => f.status === 'VALIDATED');

                data.forEach(file => {
                    fileDataMap.set(file.id, file);
                    const targetFilesStr = file.targetFiles ? file.targetFiles.join(', ') : '';
                    let errorMessageHtml = '';
                    if (file.status === 'ERROR' && file.errorMessage) {
                         errorMessageHtml = `<br><small class="text-danger">${file.errorMessage}</small>`;
                    }

                    // Dependency warning check (if layer > 1 and lower layers are not all validated)
                    let warningClass = '';
                    let isBlocked = false;
                    if (file.layer > 1 && file.status === 'SCANNED') {
                        for(let l = 1; l < file.layer; l++) {
                            if (!isLayerValidated(l)) {
                                isBlocked = true;
                                warningClass = 'table-warning';
                                errorMessageHtml += `<br><small class="text-warning">En attente de la Couche ${l}</small>`;
                                break;
                            }
                        }
                    }

                    let actionsHtml = '';
                    if (file.status === 'SCANNED' || file.status === 'ERROR') {
                        actionsHtml = `<button class="btn btn-sm btn-primary" ${isBlocked ? 'disabled' : ''} onclick="convertFile(${file.id})">Convertir</button>`;
                    } else if (file.status === 'NEEDS_REVIEW') {
                        actionsHtml = `
                            <button class="btn btn-sm btn-info me-1" onclick="viewCode(${file.id})">Voir le code</button>
                            <button class="btn btn-sm btn-success me-1" onclick="validateFile(${file.id})">Valider</button>
                            <button class="btn btn-sm btn-warning" onclick="openRetryModal(${file.id}, '${file.sourceFile}')">Ajuster avec l'IA</button>
                        `;
                    } else if (file.status === 'VALIDATED') {
                        actionsHtml = `<span class="text-success">✔ Validé</span>`;
                    }

                    const row = `<tr class="${warningClass}">
                        <td><span class="badge bg-secondary">${file.fileType}</span></td>
                        <td><strong>Couche ${file.layer || 1}</strong></td>
                        <td title="${file.absolutePath}">${file.sourceFile}</td>
                        <td>${targetFilesStr}</td>
                        <td>
                            <span class="badge badge-${file.status}">${file.status}</span>
                            ${errorMessageHtml}
                        </td>
                        <td>${actionsHtml}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    function convertFile(id) {
        fetch(`/api/migration/files/${id}/convert`, { method: 'POST' })
        .then(response => {
            if (response.ok) fetchData();
            else alert("Erreur lors de la demande de conversion.");
        })
        .catch(error => console.error('Error converting:', error));
    }

    function validateFile(id) {
        fetch(`/api/migration/files/${id}/validate`, { method: 'POST' })
        .then(response => {
            if (response.ok) fetchData();
            else alert("Erreur lors de la validation.");
        })
        .catch(error => console.error('Error validating:', error));
    }

    function openRetryModal(id, sourceFile) {
        document.getElementById('modalFileId').value = id;
        document.getElementById('modalFileName').textContent = sourceFile;
        document.getElementById('customPrompt').value = '';
        retryModal.show();
    }

    function submitRetry() {
        const id = document.getElementById('modalFileId').value;
        const customPrompt = document.getElementById('customPrompt').value;

        fetch(`/api/migration/files/${id}/retry`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customPrompt: customPrompt })
        })
        .then(response => {
            if (response.ok) {
                retryModal.hide();
                fetchData();
            } else {
                alert("Erreur lors de la relance du traitement.");
            }
        })
        .catch(error => {
            console.error('Error retrying:', error);
            alert("Erreur réseau.");
        });
    }

    function viewCode(id) {
        fetch(`/api/migration/files/${id}/content`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('sourceCodeBlock').textContent = data.sourceCode || 'Non généré.';
                document.getElementById('testCodeBlock').textContent = data.testCode || 'Non généré.';
                codeModal.show();
            })
            .catch(err => {
                alert("Erreur lors de la récupération du code.");
            });
    }
</script>
</body>
</html>
